# =============================================================================
# API Test Studio — Nginx Configuration
# Serves the Vite production build as a Single-Page Application.
#
# Key behaviours:
#   • All non-file routes fall back to index.html (React Router support).
#   • Static assets (JS/CSS/images) are cached for 1 year via immutable headers.
#   • Gzip compression is enabled for all text types.
#   • Basic security headers are set on every response.
#   • /api/* requests are forwarded to the FastAPI backend.
#     Set NGINX_BACKEND_URL at runtime or replace the default below.
# =============================================================================

# Note: the "http {}" block is already defined in /etc/nginx/nginx.conf.
# This file is included as a virtual-host snippet inside that block.

server {
    listen       80;
    server_name  _;          # match any hostname

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"              always;
    add_header X-Content-Type-Options "nosniff"                 always;
    add_header X-XSS-Protection       "1; mode=block"           always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Static asset caching (Vite fingerprints filenames) ───────────────────
    # Vite appends a content hash to every JS/CSS chunk (e.g. index-DXw8.js),
    # so it is safe to cache them indefinitely.
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        # Re-apply security headers (add_header doesn't inherit in nested blocks)
        add_header X-Frame-Options        "SAMEORIGIN"              always;
        add_header X-Content-Type-Options "nosniff"                 always;
    }

    # ── API reverse proxy ─────────────────────────────────────────────────────
    # Forwards /api/* to the FastAPI backend.
    # The backend address is read from the NGINX_BACKEND_HOST env variable
    # when using docker-compose; for standalone Docker use the host network
    # or set the upstream address directly below.
    #
    # Default: http://backend:8000  (works with Docker Compose service name)
    # Override at runtime:  docker run -e NGINX_BACKEND_HOST=http://host.docker.internal:8000 ...
    # Note: env var substitution requires the envsubst entrypoint (see Phase 10.3).
    # For standalone Phase 10.2 the proxy block below uses a literal address;
    # change it to match your backend location.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Disable buffering for streaming responses (e.g. job polling)
        proxy_buffering    off;
    }

    # ── SPA fallback — React Router support ──────────────────────────────────
    # Any request that doesn't match a real file is served index.html.
    # This makes /runs/abc, /analytics, /upload etc. work on page refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Deny hidden files (.env, .git, etc.) ─────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
