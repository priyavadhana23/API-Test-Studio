# =============================================================================
# API Test Studio - Main Configuration File
# =============================================================================
# This file contains all application-level configuration.
# Do NOT hardcode these values anywhere else in the project.
# =============================================================================

application:
  name: "API Test Studio"
  version: "1.0.0"
  description: "Enterprise-grade Generic API Testing Platform"
  author: "API Test Studio Team"

# Active environment - must match a key defined in environments.yaml
active_environment: "development"

# Logging configuration
logging:
  level: "DEBUG"              # DEBUG | INFO | WARNING | ERROR | CRITICAL
  console_enabled: true
  file_enabled: true
  log_dir: "logs"
  log_filename_prefix: "api_test_studio"
  max_bytes: 10485760         # 10 MB per log file
  backup_count: 7             # Keep 7 days of rotated logs
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"

# Directory paths (relative to project root)
paths:
  uploaded_specs: "uploaded_specs"
  reports: "reports"
  history: "history"
  database: "database"
  logs: "logs"
  schemas: "schemas"

# Supported specification formats
supported_spec_formats:
  - "openapi_3"
  - "swagger_2"
  - "postman_collection"
  - "raml"

# Request execution defaults (used in future phases)
execution:
  default_timeout_seconds: 30
  max_retries: 3
  retry_delay_seconds: 2
  verify_ssl: true

# Reporting defaults (used in future phases)
reporting:
  default_format: "html"      # html | json | csv | pdf
  include_request_body: true
  include_response_body: true
  include_headers: false
